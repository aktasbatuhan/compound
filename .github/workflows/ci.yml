name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (benchmark engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check src tests scripts sdk
      - run: uv run compound validate-config
      - run: uv run pytest -q

  typescript:
    name: typescript (trace pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test packages

  docs:
    name: docs (reference is current and the site builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: bun install --frozen-lockfile
      - run: uv run python scripts/build_cli_reference.py
      - run: python3 scripts/serving_evidence.py --check
      - name: generated pages match the code
        run: git diff --exit-code -- website/src/content/docs/reference/cli.md site/report
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
