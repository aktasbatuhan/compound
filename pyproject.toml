[project]
name = "compound-optimizer"
version = "0.1.0"
description = "Reproducible recursive optimization experiments across single-shot and agentic benchmarks"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gepa==0.1.4",
  "openai>=1.100.0",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]
# Official BFCL checkers, pinned to the version recorded in
# benchmarks/manifests/bfcl.json. Heavy dependency tree; only needed to
# grade BFCL runs, so it stays out of the default install.
bfcl = [
  "bfcl-eval==2025.12.17",
  # qwen-agent (pulled in by bfcl-eval's model handlers) imports soundfile at
  # import time but does not declare it; the AST checker import chain needs it.
  "soundfile>=0.12.1",
]

[project.scripts]
compound = "compound.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compound"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".compound"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
