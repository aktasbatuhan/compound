[project]
name = "compound-sdk"
version = "0.1.0"
description = "Record the shape of your model calls (sizes, timing, prompt reuse) without their text"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
litellm = ["litellm>=1.40"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compound_sdk"]
