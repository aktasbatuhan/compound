version: 1

artifacts_dir: artifacts
manifests_dir: benchmarks/manifests
seed: 20260717

budget:
  paid_runs_enabled: true
  hard_limit_usd: 25.00
  smoke_cases_per_benchmark: 2

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    type: openai_compatible
  doubleword:
    base_url: https://api.doubleword.ai/v1
    api_key_env: DOUBLEWORD_API_KEY
    type: flex
  # OpenAI direct (issue #10). openai_compatible, so no adapter code — the same
  # HttpProvider that serves OpenRouter serves it. Any host that mirrors this API
  # (vLLM, Fireworks, Together, Groq, Cerebras, …) is one more provider block.
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    type: openai_compatible
    # OpenAI caches prompt prefixes on its own; no marker to inject.
    cache_strategy: implicit
    # Current OpenAI models reject max_tokens (400: use max_completion_tokens).
    max_tokens_field: max_completion_tokens
  # Same endpoint and weights, billed on the queued discount tier. Kept as its
  # own provider so a grid can run both tiers as separate arms and the request
  # body carries service_tier on every call. OpenAI echoes the tier back on
  # every streamed chunk (recorded as service_tier_echo), so tier compliance is
  # checkable per call the way a provider pin is. Flex bills at Batch API rates
  # with prompt caching on top; when capacity is short it returns 429 "Resource
  # Unavailable" and does not charge, which the harness records as a failure
  # rather than retrying, since that rate is the tier's reliability. OpenAI
  # recommends a 15 minute client timeout on flex (docs, 2026-09-04), so the
  # arm declares it: with the harness default a slow-but-served flex call
  # would be booked as a timeout.
  openai-flex:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    type: openai_compatible
    service_tier: flex
    cache_strategy: implicit
    timeout_s: 900
    max_tokens_field: max_completion_tokens
  # Anthropic, on its native Messages API. Its OpenAI-compatible layer is a
  # test surface that drops what a comparison needs (no prompt caching, empty
  # prompt_tokens_details, service_tier ignored, temperature capped at 1), so
  # measuring through it would score Anthropic at 0% cache the way an unmarked
  # call scores Doubleword. `type: anthropic` switches the serving harness to
  # /messages with x-api-key auth; the cache is the same opt-in cache_control
  # marker Doubleword uses, so it is explicit_marker. The pinning proxy refuses
  # this host (it forwards chat-completions bodies verbatim) rather than route
  # it through the lossy layer. Priority Tier is no longer sold, so there is
  # one arm; the tier that served each call still lands in service_tier_echo.
  anthropic:
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    type: anthropic
    cache_strategy: explicit_marker
  # Z.ai serves GLM first-party. Its id for the weights is bare (glm-5.3-flash)
  # where OpenRouter namespaces them (z-ai/glm-5.3-flash), so an arm needs
  # --host-model zai=glm-5.3-flash. Reports prompt_tokens_details.cached_tokens,
  # so its cache is measurable the same way as the OpenRouter majors'.
  # Telnyx publishes cross-provider serving comparisons of the models it also
  # sells, so it belongs in ours as a measured arm rather than a citation. Its
  # OpenAI-compatible surface returns prompt_tokens_details: null and no cost
  # field, so latency, throughput and output are measurable here while cache and
  # per-call cost are not; those have to come from its billing side.
  telnyx:
    base_url: https://api.telnyx.com/v2/ai
    api_key_env: TELNYX_API_KEY
    type: openai_compatible
    cache_strategy: implicit
  zai:
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    type: openai_compatible
    cache_strategy: implicit

models:
  frontier:
    - id: openai/gpt-5.6-sol
      provider: openrouter
      role: reference
    - id: anthropic/claude-opus-4.8
      provider: openrouter
      role: reference
  candidates:
    - id: thinkingmachines/Inkling-NVFP4
      provider: doubleword
      role: candidate
      backend: flex
    - id: zai-org/GLM-5.2-FP8
      provider: doubleword
      role: candidate
      backend: flex
    - id: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
      provider: doubleword
      role: candidate
      backend: flex
    - id: deepseek-ai/DeepSeek-V4-Flash
      provider: doubleword
      role: candidate
      backend: flex
    - id: gpt-4o-mini
      provider: openai
      role: candidate
      # Same weights, different id per host (issue #19): the logical id
      # `gpt-4o-mini` stays the storage/telemetry identity, while each provider
      # receives its own wire id. Lets one entry gate OpenAI-direct vs OpenRouter.
      provider_ids:
        openai: gpt-4o-mini
        openrouter: openai/gpt-4o-mini

pricing_usd_per_million_tokens:
  openai/gpt-5.6-sol:
    input: 5.00
    output: 30.00
  anthropic/claude-opus-4.8:
    input: 5.00
    output: 25.00
  zai-org/GLM-5.2-FP8:
    input: 1.40
    output: 4.40
  nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4:
    input: 0.50
    output: 2.50
  gpt-4o-mini:
    input: 0.15
    output: 0.60

# Doubleword's Responses API service_tier=flex uses the published async rates.
# Keep these separate from the synchronous/default route prices above.
flex_pricing_usd_per_million_tokens:
  thinkingmachines/Inkling-NVFP4:
    input: 0.90
    output: 3.00
  zai-org/GLM-5.2-FP8:
    input: 0.70
    output: 2.25
  nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4:
    input: 0.38
    output: 1.65
  deepseek-ai/DeepSeek-V4-Flash:
    input: 0.07
    output: 0.14

# Rate cards for serving hosts that return no per-call cost, keyed by route
# label then model id, $ per million tokens. Everything priced from these is
# DERIVED and is labelled so wherever it is shown; OpenRouter's per-call cost
# is the provider's own bill and always wins when present. `cached_input` is
# the cache-read rate, `cache_write` the write premium where a host bills one
# (Anthropic 5 minute TTL = 1.25x input); a missing field falls back to `input`.
serving_rates_usd_per_million_tokens:
  # Telnyx publishes $0.13 in / $0.03 cached / $0.26 out for this model. 920
  # calls priced at these rates summed to $1.3924 against a $1.39 dashboard
  # bill (0.2%), 2026-09-04.
  telnyx:
    deepseek-v4-flash:
      input: 0.13
      cached_input: 0.03
      output: 0.26
  # OpenAI pricing page, 2026-09-04. Standard tier.
  openai:
    gpt-5.6-sol:
      input: 4.00
      cached_input: 0.40
      output: 20.00
    gpt-5.4-mini:
      input: 0.75
      cached_input: 0.075
      output: 4.50
  # Flex tier: Batch API rates, half of standard.
  openai-flex:
    gpt-5.4-mini:
      input: 0.375
      cached_input: 0.0375
      output: 2.25
  # platform.claude.com pricing page, 2026-09-04. cache_write is the 5m TTL
  # write, the TTL the marker injects.
  anthropic:
    claude-opus-5:
      input: 5.00
      cached_input: 0.50
      cache_write: 6.25
      output: 25.00
    claude-sonnet-5:
      input: 2.00
      cached_input: 0.20
      cache_write: 2.50
      output: 10.00

benchmarks:
  ds1000:
    task_key: data_processing
    revision: b39aab71da6d23ef8d3cac59a7c5f834516ab334
    sample_count: 30
    strata: [numpy, pandas, scipy, pytorch, tensorflow, sklearn, matplotlib]
    partitions:
      optimizer_train: 15
      optimizer_validation: 5
      decision_test: 10
  bfcl:
    task_key: tool_calling
    revision: f7cf7359b7ac615a0b294831c5ba2bc95ee4a000
    package: bfcl-eval==2025.12.17
    sample_count: 30
    strata: [single_turn, multi_turn]
    partitions:
      optimizer_train: 15
      optimizer_validation: 5
      decision_test: 10
  tau_bench:
    task_key: conversational_agent
    revision: 07d5b3340b2d016df8c36c9c1a6376ef9f29155d
    sample_count: 20
    strata: [retail, airline, telecom]
    trials: 3
    max_steps: 30
    agent_max_tokens: 4096
    user_max_tokens: 2048
    partitions:
      optimizer_train: 10
      optimizer_validation: 4
      decision_test: 6

optimization:
  algorithm: gepa
  mutable_components: [system_prompt]
  max_metric_calls: 120
  selection: pareto
  require_textual_feedback: true

gate:
  metric: task_success
  max_regression: 0.02
  require_decision_test: true

judges:
  support:
    model: anthropic/claude-opus-4.8
    prompt_version: v1
    rubric: "The response fully and correctly resolves the user's request, is accurate, and is polite. Score 1 only if it would satisfy the user; score 0 if it is wrong, evasive, or unhelpful."
    mode: pointwise
    calibration_threshold: 0.6
    decision_point: 0.5
